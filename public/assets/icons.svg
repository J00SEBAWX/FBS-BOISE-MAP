<svg xmlns="http://www.w3.org/2000/svg">
<!-- FBS Store Map icon sprite. One style: 24x24 grid, 1.75 stroke, round caps + joins, no fills
     (except the small dots). Colour comes from the page: stroke="currentColor".
     Use: <svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons.svg#i-undo"/></svg>
     Size with CSS (width/height from the icon-sm/md/lg tokens); give the BUTTON an accessible name, not the icon. -->

<!-- ===== tools ===== -->
<symbol id="i-select" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3.5 18.5 11l-5.9 1.6-2.9 5.9z"/><path d="m12.6 12.6 5.4 5.4"/></symbol>
<symbol id="i-hand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 13.5v-5a1.5 1.5 0 0 1 3 0v3"/><path d="M10.5 11.5V5a1.5 1.5 0 0 1 3 0v6.5"/><path d="M13.5 11.5V6.5a1.5 1.5 0 0 1 3 0v5.5"/><path d="M16.5 12V9.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1.2a6 6 0 0 1-4.7-2.3l-2.9-3.7a1.6 1.6 0 0 1 2.4-2.1l1.4 1.6"/></symbol>
