<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FBS Boise Store Walk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#e9ecea; --panel:#ffffff; --panel-2:#f4f6f5; --ink:#1d2226; --muted:#5d666c; --line:#cdd3d1;
  --accent:#c8102e; --accent-ink:#ffffff; --cedar:#8a5a34; --ok:#1f7a4d; --warn:#9a5b00;
  --map-bg:#f7f7f4; --map-grid:#dde1de; --map-grid-major:#b9c0bd; --map-label:#2a3035; --map-wall:#2b3035;
  --shadow:0 1px 2px rgba(20,24,28,.08),0 6px 18px rgba(20,24,28,.10);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131619; --panel:#1b1f23; --panel-2:#22272c; --ink:#e7eaec; --muted:#9aa3a9; --line:#30373d;
    --accent:#e2334d; --accent-ink:#ffffff; --cedar:#c08a5c; --ok:#4cc38a; --warn:#e0a54a;
    --map-bg:#1a1e22; --map-grid:#262c31; --map-grid-major:#39414a; --map-label:#e3e7ea; --map-wall:#c9cfd3;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131619; --panel:#1b1f23; --panel-2:#22272c; --ink:#e7eaec; --muted:#9aa3a9; --line:#30373d;
  --accent:#e2334d; --accent-ink:#ffffff; --cedar:#c08a5c; --ok:#4cc38a; --warn:#e0a54a;
  --map-bg:#1a1e22; --map-grid:#262c31; --map-grid-major:#39414a; --map-label:#e3e7ea; --map-wall:#c9cfd3;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden;}
*{box-sizing:border-box;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5;}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;}
.brand b{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1;}
.brand span{font-family:var(--display);font-weight:500;font-size:18px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;}
.tabs{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px;}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:6px;font-weight:600;color:var(--muted);white-space:nowrap;}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);}
.tabs button[aria-pressed="true"] .dot{background:var(--accent);}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:1px;}
.spacer{flex:1;}
.actions{display:flex;align-items:center;gap:6px;}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:7px;font-weight:500;white-space:nowrap;}
.btn:hover{border-color:var(--muted);}
.btn:disabled{opacity:.45;cursor:default;}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
.btn.icon{padding:6px 9px;min-width:34px;}
.status{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px;}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;}
.status[data-s="saved"] i{background:var(--ok);}
.status[data-s="dirty"] i{background:var(--warn);}
.status[data-s="local"] i{background:var(--warn);}
.menu{position:absolute;right:16px;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:grid;min-width:220px;z-index:20;}
.menu button{border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:6px;}
.menu button:hover{background:var(--panel-2);}

/* ---------- stage ---------- */
.stage{position:relative;min-height:0;display:grid;grid-template-columns:1fr auto;}
.view{position:relative;min-width:0;min-height:0;overflow:hidden;}
#mapCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--map-bg);touch-action:none;cursor:default;}
#three{position:absolute;inset:0;touch-action:none;}
#three canvas{display:block;width:100%!important;height:100%!important;}
.float{position:absolute;display:flex;gap:6px;align-items:center;z-index:3;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);}
.tl{left:16px;top:12px;flex-wrap:wrap;max-width:calc(100% - 32px);}
.tr{right:16px;top:12px;}
.bl{left:16px;bottom:12px;}
.br{right:16px;bottom:12px;}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;white-space:nowrap;}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel));}
.palette{left:16px;right:16px;bottom:12px;overflow-x:auto;padding:8px 10px;scrollbar-width:thin;}
.palette .lbl{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted);font-size:14px;white-space:nowrap;}
.palette-wrap{position:absolute;left:16px;bottom:12px;right:16px;display:flex;justify-content:flex-start;z-index:3;pointer-events:none;}
.palette-wrap .card{pointer-events:auto;display:flex;gap:6px;align-items:center;padding:7px 9px;overflow-x:auto;max-width:100%;}
.hint{font-size:12px;color:var(--muted);padding:6px 10px;}
.zoom{flex-direction:column;}
.zoom .btn{width:34px;padding:5px 0;text-align:center;}

/* ---------- inspector ---------- */
.inspector{width:300px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;display:flex;flex-direction:column;}
.inspector header{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:grid;gap:4px;}
.eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.inspector h2{margin:0;font-family:var(--display);font-size:24px;line-height:1.05;font-weight:700;text-wrap:balance;}
.fields{padding:12px 16px;display:grid;gap:10px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fld{display:grid;gap:4px;}
.fld label{font-size:12px;color:var(--muted);font-weight:500;}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:7px 8px;}
.fld input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.fld input[type=color]{padding:2px;height:34px;}
.fld .ftin{font-family:var(--mono);font-size:11px;color:var(--muted);}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding-top:2px;}
.fld .sides input{width:auto;}
.ins-actions{padding:4px 16px 16px;display:flex;flex-wrap:wrap;gap:6px;}
.ins-actions .danger{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));}
.empty{padding:18px 16px;color:var(--muted);display:grid;gap:10px;font-size:13px;line-height:1.5;}
.empty h3{margin:0;font-family:var(--display);font-size:20px;color:var(--ink);text-transform:uppercase;letter-spacing:.03em;}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--panel-2);color:var(--ink);}
.legend{display:grid;gap:6px;}
.legend div{display:flex;gap:8px;align-items:center;}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.2);flex:none;}

/* ---------- walk HUD ---------- */
.loc{padding:8px 12px;display:grid;gap:2px;max-width:280px;}
.loc .eyebrow{font-size:12px;}
.loc b{font-family:var(--display);font-size:20px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;}
.loc span{font-size:12px;color:var(--muted);font-family:var(--mono);}
#mini{display:block;width:220px;height:124px;border-radius:9px;cursor:crosshair;touch-action:none;}
.mini-card{padding:5px;}
.walk-hint{display:block;font-size:12px;color:var(--muted);padding:7px 10px;max-width:320px;line-height:1.7;}

/* ---------- dialogs ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.45);display:grid;place-items:center;z-index:50;padding:16px;}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;padding:18px;display:grid;gap:12px;}
.dialog h3{margin:0;font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.02em;}
.dialog p{margin:0;color:var(--muted);line-height:1.5;}
.dialog textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);font-family:var(--mono);font-size:11px;padding:8px;}
.dialog .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:center;}
.keys h4{grid-column:1/-1;margin:8px 0 0;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:15px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow);}

.arealist{display:grid;gap:4px;}
.arearow{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);text-align:left;width:100%;}
.arearow:hover{border-color:var(--muted);}
.arearow b{font-weight:600;font-size:13px;color:var(--ink);display:block;line-height:1.25;}
.arearow small{font-size:11px;color:var(--muted);}
.arearow .st{font-size:11px;font-weight:600;white-space:nowrap;color:var(--muted);}
.arearow .st.ok{color:var(--ok);} .arearow .st.warn{color:var(--warn);}
.tag{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;color:var(--muted);vertical-align:1px;}
.area-sec{display:grid;gap:6px;padding:0 16px 12px;font-size:13px;line-height:1.45;}
.area-sec h4{margin:4px 0 0;font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:14px;color:var(--muted);}
.area-sec ul{margin:0;padding-left:18px;}
.nearrow{display:flex;gap:8px;align-items:baseline;}
.nearrow i{font-style:normal;font-weight:700;width:14px;flex:none;}
.nearrow .ok{color:var(--ok);} .nearrow .warn{color:var(--warn);} .nearrow .na{color:var(--muted);}
.note{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--panel));padding:6px 9px;border-radius:0 6px 6px 0;}
.hintbox{border-left:3px solid var(--line);padding:4px 9px;color:var(--muted);}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;} .prog i{display:block;height:100%;background:var(--ok);}
@media (max-width:760px){
  .bar{padding:8px 12px;gap:8px;}
  .brand span{display:none;}
  .stage{grid-template-columns:1fr;}
  .inspector{position:absolute;left:0;right:0;bottom:0;width:auto;max-height:52%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--shadow);z-index:8;}
  .inspector.is-empty{display:none;}
  .status{display:none;}
  #mini{width:170px;height:96px;}
  .walk-hint{display:none;}
  .loc{max-width:150px;padding:6px 9px;}
  .loc b{font-size:16px;}
  .hide-sm{display:none;}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }
</style>

<div id="app">
  <header class="bar">
    <div class="brand"><b>FBS Boise</b><span>Store Walk</span></div>
    <div class="tabs" role="group" aria-label="View">
      <button id="tabMap" aria-pressed="true"><i class="dot"></i>Plan</button>
      <button id="tabWalk" aria-pressed="false"><i class="dot"></i>Walk with Jerry</button>
    </div>
    <div class="spacer"></div>
    <div class="actions">
      <span class="status" id="status" data-s="saved"><i></i><span id="statusText">Surveyed layout</span></span>
      <button class="btn icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
      <button class="btn icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">&#8631;</button>
      <button class="btn primary" id="saveBtn">Save layout</button>
      <button class="btn icon" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-label="More">&#8943;</button>
    </div>
    <div class="menu" id="menu" hidden>
      <button id="mExport">Copy or paste layout (JSON)</button>
      <button id="mHelp">Controls and shortcuts</button>
      <button id="mReset">Reset to surveyed layout</button>
    </div>
  </header>

  <main class="stage">
    <section class="view" id="mapView">
      <canvas id="mapCanvas" aria-label="Store plan. Drag items to move them; double-click the floor to send Jerry there."></canvas>
      <div class="float tl">
        <button class="chip" id="structBtn" aria-pressed="false" title="Walls, floors, doors and arches are locked until you switch this on">Walls &amp; doors: locked</button>
        <button class="chip" id="snapBtn" aria-pressed="true">Snap 6&quot;</button>
        <button class="chip" id="labelsBtn" aria-pressed="true">Labels</button>
        <button class="chip" id="areasBtn" aria-pressed="false" title="The store areas from the reset plan">Areas</button>
      </div>
      <div class="float tr zoom">
        <button class="btn" id="zIn" aria-label="Zoom in">+</button>
        <button class="btn" id="zOut" aria-label="Zoom out">&minus;</button>
        <button class="btn" id="zFit" aria-label="Fit plan" title="Fit (F)">&#9635;</button>
      </div>
      <div class="palette-wrap">
        <div class="card" id="palette"><span class="lbl">Add</span></div>
      </div>
    </section>

    <section class="view" id="walkView" hidden>
      <div id="three"></div>
      <div class="float tl">
        <div class="tabs" role="group" aria-label="Camera">
          <button id="camFollow" aria-pressed="true">Follow Jerry</button>
          <button id="camEye" aria-pressed="false">Jerry&rsquo;s eyes</button>
        </div>
        <button class="chip" id="spinBtn" aria-pressed="false" title="Slowly turn a full 360&deg; (Space)">360&deg; look</button>
        <button class="chip" id="ceilBtn" aria-pressed="false">Ceiling</button>
        <button class="chip" id="signBtn" aria-pressed="true">Area signs</button>
      </div>
      <div class="float tr card loc" id="locCard">
        <span class="eyebrow">Jerry is in</span>
        <b id="locZone">Front room</b>
        <span id="locNear">near the front door</span>
      </div>
      <div class="float bl card mini-card"><canvas id="mini" aria-label="Mini map. Tap to send Jerry."></canvas></div>
      <div class="float br card walk-hint" id="walkHint"></div>
    </section>

    <aside class="inspector" id="inspector"></aside>
  </main>
</div>

<div class="scrim" id="dlg" hidden><div class="dialog" id="dlgBody" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

const LS_KEY = "fbs-store-walk-layout-v1";
let draftT = 0;
function saveDraft(){ clearTimeout(draftT); draftT=setTimeout(()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify({items:S.items, ts:Date.now()})); }catch(e){} }, 400); }
function loadDraft(){ try{ const d=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(d && Array.isArray(d.items) && d.items.length) return d; }catch(e){} return null; }
let DB = null;
const DOC = "layouts/main";
async function initDb(){
  try{
    if(!window.claude || typeof window.claude.use !== "function") return;
    DB = await window.claude.use("db");
    if(!DB) return;
    const snap = await DB.doc(DOC).get();
    if(snap && snap.exists){
      const d = snap.data() || {};
      const draft = loadDraft();
      if(Array.isArray(d.items) && d.items.length && !S.dirty && !(draft && draft.ts > (d.ts||0))){
        S.items = d.items; S.sel=null; S.gridDirty=S.sceneDirty=true; S.savedTs=d.ts||0;
        setStatus("saved","Saved layout loaded"); drawMap(); renderInspector();
      }
    }
  }catch(e){ /* stays on the device copy */ }
}
async function saveLayout(){
  const payload = {items:S.items, ts:Date.now(), app:"fbs-store-walk", v:1};
  try{ localStorage.setItem(LS_KEY, JSON.stringify({items:S.items, ts:payload.ts})); }catch(e){}
  if(!DB){ S.dirty=false; setStatus("local","Saved on this device"); toast("Saved on this device. Your store file isn't connected in this view."); return; }
  setStatus("dirty","Saving…");
  try{ await DB.doc(DOC).set(payload); S.dirty=false; S.savedTs=payload.ts; setStatus("saved","Saved"); toast("Layout saved"); }
  catch(e){ setStatus("local","Saved on this device"); toast("Couldn't save to the store file, so it's kept on this device. You may only have view access."); }
}

function paintMap(){

  const ctx=mctx; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,mapW,mapH);
  ctx.fillStyle=css("--map-bg"); ctx.fillRect(0,0,mapW,mapH);

function bubble(ctx,x,y,t){ ctx.save(); ctx.fillStyle=css("--panel"); ctx.strokeStyle=css("--map-grid-major"); ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle=css("--muted"); ctx.fillText(t,x,y+1); ctx.restore(); }
function drawItems(ctx, mini){
  const order = {floor:0, area:0.5, zone:9, platform:1};
  const list = S.items.slice().sort((a,b)=>(order[a.type]??5)-(order[b.type]??5));
  const wallCol = css("--map-wall");
  for(const it of list){
    if(it.type==="zone") continue;
    ctx.save();
    if(it.type==="floor"){ pathItem(ctx,it); ctx.fillStyle=shade(it.color||"#cccccc",0.45); ctx.fill(); ctx.restore(); continue; }
    if(it.type==="wall"){ pathItem(ctx,it); ctx.fillStyle=wallCol; ctx.fill(); ctx.restore(); continue; }

function drawOpening(ctx,it,mini){
  const c=corners(it).map(p=>W2S(...p));

  const a=W2S(...toWorld(it,-it.w/2,0)), b=W2S(...toWorld(it,it.w/2,0));

  ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); ctx.setLineDash([]);

/* counter rings: rectangle or octagon, with any number of staff openings */

    const dx=e.clientX-prev.x, dy=e.clientY-prev.y; if(Math.hypot(e.clientX-st.x,e.clientY-st.y)>6) st.moved=true;
    CAM.yaw-=dx*0.006; if(CAM.mode==="eye") CAM.look=clamp(CAM.look-dy*0.005,-1.2,1.2); else CAM.pitch=clamp(CAM.pitch+dy*0.005,0.05,1.45); });
  const up=e=>{ ptr.delete(e.pointerId); if(st && !st.pinch && !st.moved && e.pointerType!=="mouse" && performance.now()-st.t<350) tapWalk(e); if(!ptr.size) st=null; };
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up);
  el.addEventListener("dblclick",e=>tapWalk(e));
  el.addEventListener("wheel",e=>{ e.preventDefault(); if(CAM.mode==="follow") CAM.dist=clamp(CAM.dist*Math.exp(e.deltaY*0.0012),4,80); }, {passive:false});
}
let ray=null, floorPlane=null;
function tapWalk(e){ if(!R) return; if(!ray){ ray=new THREE.Raycaster(); floorPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0); } const r=R.renderer.domElement.getBoundingClientRect(); const v=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(v,R.camera);
  // hit furniture first, walk to the floor in front of it
  const hit=new THREE.Vector3(); if(!ray.ray.intersectPlane(floorPlane,hit)) return; walkTo(hit.x,-hit.z); }

/* ---------- mini map ---------- */
const mini=$("#mini"); const mctx2=mini.getContext("2d");
function drawMini(){
  const r=mini.getBoundingClientRect(); const pr=Math.min(window.devicePixelRatio||1,2); if(mini.width!==Math.round(r.width*pr)){ mini.width=Math.round(r.width*pr); mini.height=Math.round(r.height*pr); }
  const save={...V}; const oW=mapW, oH=mapH; mapW=r.width; mapH=r.height; V.s=Math.min((mapW-8)/(BLD.L+2),(mapH-8)/(BLD.W+2)); V.cx=BLD.L/2; V.cy=BLD.W/2;
  const ctx=mctx2; ctx.setTransform(pr,0,0,pr,0,0); ctx.fillStyle=css("--map-bg"); ctx.fillRect(0,0,mapW,mapH); drawItems(ctx,true); drawJerryMap(ctx);
  mini._v={...V, W:mapW, H:mapH}; Object.assign(V,save); mapW=oW; mapH=oH;
}
mini.addEventListener("pointerdown",e=>{ const v=mini._v; if(!v) return; const x=(e.offsetX-v.W/2)/v.s+v.cx, y=(v.H/2-e.offsetY)/v.s+v.cy; walkTo(x,y); });

/* ---------- where is Jerry ---------- */
function locate(){
  const J=S.jerry; let zone="Outside";
  for(const it of S.items) if(it.type==="floor" && inItem(it,J.x,J.y)) zone=it.name;
  for(const it of S.items) if(it.type==="area" && inItem(it,J.x,J.y)) zone=it.name;
  let best=null, bd=9;
  for(const it of S.items){ if(STRUCT.has(it.type)&&it.type!=="door"&&it.type!=="arch"&&it.type!=="opening") continue; if(it.type==="zone"||it.type==="area") continue;
    const [lx,ly]=toLocal(it,J.x,J.y); const dx=Math.max(0,Math.abs(lx)-it.w/2), dy=Math.max(0,Math.abs(ly)-it.d/2); const dd=Math.hypot(dx,dy); if(dd<bd){bd=dd;best=it;} }
  return {zone, near: best ? `${bd<1.5?"at":"near"} ${best.name}` : `x ${J.x.toFixed(0)}′, y ${J.y.toFixed(0)}′`};
}

/* ================= simulation loop ================= */
let lastT=performance.now(), locT=0;
function tick(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  const J=S.jerry; let moving=false;
  if(S.gridDirty) buildGrid();
  // keyboard walking (walk view only)
  if(S.mode==="walk"){
    let f=0,s=0; if(keys.has("KeyW")||keys.has("ArrowUp")) f+=1; if(keys.has("KeyS")||keys.has("ArrowDown")) f-=1; if(keys.has("KeyD")||keys.has("ArrowRight")) s+=1; if(keys.has("KeyA")||keys.has("ArrowLeft")) s-=1;
    if(keys.has("KeyQ")) CAM.yaw+=1.8*dt; if(keys.has("KeyE")) CAM.yaw-=1.8*dt;
    if(f||s){ J.path=[]; const sp=(keys.has("ShiftLeft")||keys.has("ShiftRight")?9:5)*dt; const fx=-Math.sin(CAM.yaw), fy=Math.cos(CAM.yaw), rx=Math.cos(CAM.yaw), ry=Math.sin(CAM.yaw);
      let dx=(fx*f+rx*s), dy=(fy*f+ry*s); const L=Math.hypot(dx,dy); dx*=sp/L; dy*=sp/L;
      if(!blockedAt(J.x+dx,J.y+dy)){ J.x+=dx; J.y+=dy; } else if(!blockedAt(J.x+dx,J.y)) J.x+=dx; else if(!blockedAt(J.x,J.y+dy)) J.y+=dy;
      J.yaw=Math.atan2(-dx,dy); moving=true; }
  }
  if(J.path.length){ const [tx,ty]=J.path[0]; const dx=tx-J.x, dy=ty-J.y, L=Math.hypot(dx,dy), sp=5.2*dt;
    if(L<=sp){ J.x=tx; J.y=ty; J.path.shift(); } else { J.x+=dx/L*sp; J.y+=dy/L*sp; }
    const want=Math.atan2(-dx,dy); let dyaw=want-J.yaw; while(dyaw>Math.PI) dyaw-=2*Math.PI; while(dyaw<-Math.PI) dyaw+=2*Math.PI; J.yaw+=dyaw*Math.min(1,dt*10); moving=true;
    if(S.mode==="map") drawMap(); }
  J.moving=moving; if(moving) J.phase+=dt*7.5;
  if(S.spin) CAM.yaw+=0.35*dt;
  if(S.mode==="walk" && R){
    if(S.sceneDirty) buildStore();
    let gz=0; for(const it of S.items){ if(it.type==="platform" && inItem(it,J.x,J.y,0)) gz=Math.max(gz,it.h||0.35); }
    J.z=(J.z||0)+(gz-(J.z||0))*Math.min(1,dt*14);
    const jm=R.jerry; jm.position.set(J.x,0,-J.y); jm.rotation.y=J.yaw;
    animateJerry(jm, moving, J.phase, now); jm.position.y+=J.z;
    const tgt=J.path.length?J.path[J.path.length-1]:null; R.marker.visible=!!tgt; if(tgt) R.marker.position.set(tgt[0],0.05,-tgt[1]);
    const c=R.camera;
    if(CAM.mode==="eye"){ jm.visible=false; if(moving && !S.spin && !keys.has("KeyQ") && !keys.has("KeyE") && J.path.length){ let d=J.yaw-CAM.yaw; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; CAM.yaw+=d*Math.min(1,dt*4); }
      c.position.set(J.x,5.85+J.z,-J.y); c.lookAt(J.x-Math.sin(CAM.yaw)*Math.cos(CAM.look), 5.85+J.z+Math.sin(CAM.look), -J.y-Math.cos(CAM.yaw)*Math.cos(CAM.look)); }
    else { jm.visible=true; const t=new THREE.Vector3(J.x,4.6+J.z,-J.y);
      const allow=camAllow(J.x,J.y,t.y,CAM.yaw,CAM.pitch,CAM.dist);
      CAM.cd=(CAM.cd===undefined||allow<CAM.cd)?allow:Math.min(allow,CAM.cd+dt*25); const d=CAM.cd;
      c.position.set(t.x+d*Math.cos(CAM.pitch)*Math.sin(CAM.yaw), t.y+d*Math.sin(CAM.pitch), t.z+d*Math.cos(CAM.pitch)*Math.cos(CAM.yaw)); c.lookAt(t); }
    R.renderer.render(R.scene,c);
    if(now-locT>250){ locT=now; const l=locate(); $("#locZone").textContent=l.zone; $("#locNear").textContent=l.near; drawMini(); }
  }
  requestAnimationFrame(tick);
}

/* ================= modes, keys, dialogs ================= */
function setMode(m){
  S.mode=m; $("#tabMap").setAttribute("aria-pressed",m==="map"); $("#tabWalk").setAttribute("aria-pressed",m==="walk");
  $("#mapView").hidden=m!=="map"; $("#walkView").hidden=m!=="walk"; $("#inspector").hidden=m!=="map";
  if(m==="walk"){ if(typeof THREE==="undefined"){ toast("The 3D view couldn't load. Check your connection and reload."); return; } init3D(); resize3D(); if(S.sceneDirty||!R.store) buildStore(); setCamMode(CAM.mode); }
  else { resizeMap(); }
}
$("#tabMap").onclick=()=>setMode("map"); $("#tabWalk").onclick=()=>setMode("walk");
window.addEventListener("resize",()=>{ if(S.mode==="map") resizeMap(); else resize3D(); });
function typing(e){ const t=e.target; return t && (t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"||t.isContentEditable); }
window.addEventListener("keydown",e=>{
  if(!$("#dlg").hidden){ if(e.key==="Escape") closeDlg(); return; }
  if(typing(e)) return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod && e.code==="KeyZ"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod && e.code==="KeyY"){ e.preventDefault(); redo(); return; }
  if(mod && e.code==="KeyS"){ e.preventDefault(); saveLayout(); return; }
  if(e.code==="KeyM"){ setMode(S.mode==="map"?"walk":"map"); return; }
  if(S.mode==="walk"){
    if(["KeyW","KeyA","KeyS","KeyD","KeyQ","KeyE","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","ShiftLeft","ShiftRight"].includes(e.code)){ keys.add(e.code); S.spin=false; syncCamBtns(); e.preventDefault(); }
    if(e.code==="KeyV") setCamMode(CAM.mode==="eye"?"follow":"eye");
    if(e.code==="Space"){ e.preventDefault(); S.spin=!S.spin; syncCamBtns(); }
    if(e.code==="Equal"||e.code==="NumpadAdd") CAM.dist=clamp(CAM.dist*0.85,4,80);
    if(e.code==="Minus"||e.code==="NumpadSubtract") CAM.dist=clamp(CAM.dist/0.85,4,80);
    if(e.code==="Escape") setMode("map");
    return;
  }
  if(mod && e.code==="KeyD"){ e.preventDefault(); duplicateSel(); return; }
  if(e.code==="Delete"||e.code==="Backspace"){ if(S.sel){ e.preventDefault(); deleteSel(); } return; }
  if(e.code==="KeyR"){ rotateSel(e.shiftKey?-90:90); return; }
  if(e.code==="BracketLeft") rotateSel(-15); if(e.code==="BracketRight") rotateSel(15);
  if(e.code==="KeyF") fitMap();
  if(e.code==="Escape"){ S.sel=null; renderInspector(); drawMap(); }
  const step=e.shiftKey?5:0.5; const nd={ArrowUp:[0,step],ArrowDown:[0,-step],ArrowLeft:[-step,0],ArrowRight:[step,0]}[e.code];
  if(nd){ e.preventDefault(); if(S.sel) nudgeSel(...nd); else { V.cx+=nd[0]*4; V.cy+=nd[1]*4; drawMap(); } }
});
window.addEventListener("keyup",e=>keys.delete(e.code));
window.addEventListener("blur",()=>keys.clear());

const dlg=$("#dlg"), dlgBody=$("#dlgBody");
function openDlg(html){ dlgBody.innerHTML=html; dlg.hidden=false; const f=dlgBody.querySelector("textarea,button"); f&&f.focus(); }
function closeDlg(){ dlg.hidden=true; dlgBody.innerHTML=""; }
dlg.addEventListener("pointerdown",e=>{ if(e.target===dlg) closeDlg(); });
const menu=$("#menu");
$("#moreBtn").onclick=()=>{ menu.hidden=!menu.hidden; $("#moreBtn").setAttribute("aria-expanded",!menu.hidden); };
document.addEventListener("pointerdown",e=>{ if(!menu.hidden && !menu.contains(e.target) && e.target!==$("#moreBtn")){ menu.hidden=true; $("#moreBtn").setAttribute("aria-expanded","false"); } });
$("#saveBtn").onclick=saveLayout; $("#undoBtn").onclick=undo; $("#redoBtn").onclick=redo;
$("#mExport").onclick=()=>{ menu.hidden=true; openDlg(`<h3>Layout file</h3><p>This is the whole layout as text. Copy it to keep a backup, or paste a saved layout here and load it.</p>
  <textarea id="jsonBox" spellcheck="false"></textarea><div class="foot"><button class="btn" id="jCopy">Copy</button><button class="btn" id="jLoad">Load pasted layout</button><button class="btn primary" id="jClose">Done</button></div>`);
  $("#jsonBox").value=JSON.stringify(S.items,null,1);
  $("#jCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText($("#jsonBox").value); toast("Copied"); }catch(e){ $("#jsonBox").select(); toast("Selected. Press Ctrl+C to copy."); } };
  $("#jLoad").onclick=()=>{ try{ const arr=JSON.parse($("#jsonBox").value); if(!Array.isArray(arr)||!arr.every(o=>o&&typeof o.x==="number"&&typeof o.y==="number"&&typeof o.w==="number"&&typeof o.d==="number"&&TYPES[o.type])) throw 0; pushUndo(); S.items=arr; S.sel=null; markChanged(); renderInspector(); closeDlg(); toast("Layout loaded"); }catch(e){ toast("That text isn't a layout from this tool. Check that you pasted all of it."); } };
  $("#jClose").onclick=closeDlg; };
$("#mReset").onclick=()=>{ menu.hidden=true; openDlg(`<h3>Reset the layout?</h3><p>This puts every wall, desk and fixture back where the photo survey placed them. Your current changes can still be undone afterwards.</p><div class="foot"><button class="btn" id="rNo">Keep my layout</button><button class="btn primary" id="rYes">Reset layout</button></div>`);
  $("#rNo").onclick=closeDlg; $("#rYes").onclick=()=>{ pushUndo(); S.items=clone(DEFAULT_ITEMS); S.sel=null; markChanged(); renderInspector(); closeDlg(); toast("Reset to the surveyed layout"); }; };
$("#mHelp").onclick=()=>{ menu.hidden=true; openDlg(`<h3>Controls</h3><div class="keys">
  <h4>Plan</h4><span>Click · drag</span><span>Select and move a fixture</span><span>Corner / round handle</span><span>Resize / rotate (Shift for 1° steps)</span>
  <span><span class="kbd">R</span> <span class="kbd">[</span> <span class="kbd">]</span></span><span>Rotate 90° / 15°</span><span><span class="kbd">Arrows</span></span><span>Nudge 6" (Shift: 5')</span>
  <span><span class="kbd">Ctrl</span>+<span class="kbd">D</span></span><span>Duplicate</span><span><span class="kbd">Delete</span></span><span>Delete</span><span><span class="kbd">Ctrl</span>+<span class="kbd">Z</span></span><span>Undo (Shift to redo)</span>
  <span>Areas chip</span><span>Store areas list: click one to add it</span><span>Double-click floor</span><span>Send Jerry there</span><span>Wheel · drag empty floor</span><span>Zoom · pan</span><span><span class="kbd">F</span></span><span>Fit the plan</span>
  <h4>Walk with Jerry</h4><span>Double-click / tap floor</span><span>Jerry walks there</span><span>Drag</span><span>Look around 360°</span>
  <span><span class="kbd">W A S D</span> or arrows</span><span>Walk (Shift to hurry)</span><span><span class="kbd">Q</span> <span class="kbd">E</span></span><span>Turn</span>
  <span><span class="kbd">V</span></span><span>Jerry's eyes / follow</span><span><span class="kbd">Space</span></span><span>Slow 360° turn</span><span><span class="kbd">+</span> <span class="kbd">−</span> · wheel</span><span>Zoom</span>
  <span><span class="kbd">M</span></span><span>Switch plan / walk</span><span><span class="kbd">Ctrl</span>+<span class="kbd">S</span></span><span>Save layout</span></div>
  <div class="foot"><button class="btn primary" id="hClose">Got it</button></div>`); $("#hClose").onclick=closeDlg; };

/* ================= boot ================= */
(function boot(){
  const d=loadDraft(); if(d){ S.items=d.items; setStatus("local","Draft from this device"); }
  renderInspector(); syncChips(); updateUndoBtns();
  resizeMap(); fitMap();
  requestAnimationFrame(tick);
  initDb();
  try{ const ro=new ResizeObserver(()=>{ if(S.mode==="map") resizeMap(); else resize3D(); }); ro.observe($(".stage")); }catch(e){}
})();

</script>
